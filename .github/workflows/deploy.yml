name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - test

      ref:
        description: Git commit SHA, branch, or tag to deploy
        required: true
        default: main

concurrency:
  group: geoprism-deploy-${{ github.event_name == 'push' && 'dev' || inputs.environment }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  AWS_REGION: us-gov-west-1
  ECR_REPOSITORY: kaleidoscope-gki/geoprism-registry
  JAVA_VERSION: "17"
  DEPLOY_ENV: ${{ github.event_name == 'push' && 'dev' || inputs.environment }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Resolve commit SHA
        id: git
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build Maven project
        run: |
          set -euo pipefail

          mvn --version
          mvn clean install -B

      - name: Prepare Docker build context
        run: |
          set -euo pipefail

          DOCKER_CONTEXT="src/build/docker/georegistry"

          rm -rf "$DOCKER_CONTEXT/target"
          mkdir -p "$DOCKER_CONTEXT/target"

          cp \
            georegistry-web/target/georegistry.war \
            "$DOCKER_CONTEXT/target/georegistry.war"

          cp -R \
            envcfg/prod \
            "$DOCKER_CONTEXT/target/appcfg"

          echo "Docker build context:"
          find "$DOCKER_CONTEXT/target" -maxdepth 2 -type f -print

      - name: Configure deployment environment
        run: |
          set -euo pipefail

          case "$DEPLOY_ENV" in
            dev)
              echo "AWS_ROLE_ARN=arn:aws-us-gov:iam::718787032875:role/github-actions-ecr-kaleidoscope-gki-geoprism-registry" >> "$GITHUB_ENV"
              ;;
            test)
              echo "AWS_ROLE_ARN=arn:aws-us-gov:iam::276847049069:role/github-actions-ecr-kaleidoscope-gki-geoprism-registry" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported deployment environment: $DEPLOY_ENV"
              exit 1
              ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_SHA: ${{ steps.git.outputs.sha }}
        working-directory: src/build/docker/georegistry
        run: |
          set -euo pipefail

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"

          echo "Environment: $DEPLOY_ENV"
          echo "Commit:      $IMAGE_SHA"
          echo "Image:       $IMAGE"

          docker build \
            --tag "$IMAGE:$DEPLOY_ENV" \
            --tag "$IMAGE:$IMAGE_SHA" \
            .

          docker push "$IMAGE:$IMAGE_SHA"
          docker push "$IMAGE:$DEPLOY_ENV"

      - name: Log out of Amazon ECR
        if: always() && steps.login-ecr.outcome == 'success'
        run: docker logout "${{ steps.login-ecr.outputs.registry }}"
